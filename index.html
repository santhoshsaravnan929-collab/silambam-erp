<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e0a900"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Silambam ERP</title><style>
:root{--wine:#a66b00;--wine2:#e0a900;--gold:#ffd34e;--bg:#fff9e8;--card:#fffdf5;--ink:#2b220f;--muted:#7b6a43;--line:#f0dfaa;--green:#16825a;--red:#c74444;--amber:#a66b00;--shadow:0 10px 28px rgba(120,84,0,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff1b8,#fffdf7 280px);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:90px}.header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--wine2),var(--gold));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 8px 18px #a66b0030}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px}.iconbtn{border:0;background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:13px}.page{padding:4px 16px}.hero{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border-radius:23px;padding:20px;box-shadow:var(--shadow);margin:6px 0 14px}.hero small{opacity:.78}.hero h1{margin:4px 0;font-size:27px}.hero p{margin:0;opacity:.82;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px #451e2d0b}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:3px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.action{border:0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left;box-shadow:0 6px 20px #451e2d0b}.action b{display:block;margin-top:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section h2{font-size:15px;margin:0}.primary{border:0;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border-radius:14px;padding:13px 15px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:12px}.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.green{background:#e8f6ef;color:var(--green)}.red{background:#fff0ef;color:var(--red)}.amber{background:#fff6e4;color:var(--amber)}.field{margin-bottom:11px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.search{margin-bottom:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:#fffdfbf2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#766b73;font-size:10px;padding:5px 7px}.nav button b{display:block;font-size:17px;margin-bottom:2px}.nav button.active{color:var(--wine);font-weight:800}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 45px rgba(120,84,0,.16)}.login-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--wine2),var(--gold));display:grid;place-items:center;font-size:30px;margin-bottom:14px}.login h1{margin:0 0 4px}.login p{color:var(--muted);font-size:13px;margin:0 0 20px}.login-error{color:var(--red);font-size:12px;margin:8px 0;min-height:16px}.empty{text-align:center;padding:25px;color:var(--muted)}.pillbar{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:11px}.pill.active{background:var(--wine);color:#fff}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#231923;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;z-index:99;display:none}.danger{background:#fff0ef;color:var(--red)}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast"></div><script>
const DB='silambam_local_v1',V=1,stores=['students','batches','attendance','fees','payments','settings'];let db,view='home',editing=null;
async function login(){
  const A=document.getElementById('app');
  A.innerHTML=`<div class="login"><div class="login-card"><div class="login-logo">⚔️</div><h1>Silambam ERP</h1><p>Private academy app • login required on every fresh app launch.</p><div class="field"><label>Username</label><input class="input" id="loginUser" autocomplete="username" value="Sarathy"></div><div class="field"><label>Password</label><input class="input" id="loginPass" type="password" autocomplete="current-password"></div><div class="login-error" id="loginErr"></div><button class="primary" style="width:100%" onclick="doLogin()">Unlock Silambam ERP</button></div></div>`;
  document.getElementById('loginPass').focus();
}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));
  const hex=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const expected='38b0462a784d9914077adb118e2b01ff1728c79b12830c19bacd320ddb74c6e1';
  if(u==='Sarathy' && hex===expected){sessionStorage.setItem('silambam_logged_in','1'); await openDB(); await seed(); await render();}
  else document.getElementById('loginErr').textContent='Incorrect username or password.';
}
function logout(){sessionStorage.removeItem('silambam_logged_in'); location.reload()}

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,V);r.onupgradeneeded=e=>{db=e.target.result;stores.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}function all(s){return new Promise((res,rej)=>{let a=[];let r=db.transaction(s).objectStore(s).openCursor();r.onsuccess=e=>{let c=e.target.result;if(c){a.push(c.value);c.continue()}else res(a)};r.onerror=()=>rej(r.error)})}function put(s,o){return new Promise((res,rej)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(s,id){db.transaction(s,'readwrite').objectStore(s).delete(id)}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function seed(){let b=await all('batches'),s=await all('students');if(!b.length){await put('batches',{name:'Morning Batch',time:'06:00–07:00',instructor:'',active:true})}if(!s.length)toast('Ready — add your first student')}
async function render(){let A=document.getElementById('app');let title=view==='home'?'Dashboard':view[0].toUpperCase()+view.slice(1);A.innerHTML=`<header class="header"><div class="brand"><div class="logo">⚔️</div><div><b>Silambam ERP</b><small>Local • Private • Offline</small></div></div><div style="display:flex;gap:7px"><button class="iconbtn" onclick="backup()">💾</button><button class="iconbtn" onclick="logout()">↪</button></div></header><main class="page">${view==='home'?await home():view==='students'?await students():view==='attendance'?await attendance():view==='fees'?await fees():view==='reports'?await reports():await settings()}</main><nav class="nav">${[['home','⌂','Home'],['students','👥','Students'],['attendance','✓','Attend'],['fees','₹','Fees'],['reports','▥','Reports']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
async function home(){let s=await all('students'),a=await all('attendance'),f=await all('fees'),p=await all('payments');let today=new Date().toISOString().slice(0,10),present=a.filter(x=>x.date===today&&x.status==='PRESENT').length,paid=p.reduce((n,x)=>n+Number(x.amount||0),0),out=f.reduce((n,x)=>n+Number(x.amount||0),0)-paid;return `<section class="hero"><small>GOOD DAY, SARATHY 👋</small><h1>Train. Track. Grow.</h1><p>Your academy at a glance — even without internet.</p></section><div class="grid"><div class="stat"><span>Active Students</span><strong>${s.filter(x=>x.active!==false).length}</strong></div><div class="stat"><span>Present Today</span><strong>${present}</strong></div><div class="stat"><span>Fees Recorded</span><strong>₹${paid.toLocaleString('en-IN')}</strong></div><div class="stat"><span>Outstanding</span><strong>₹${Math.max(0,out).toLocaleString('en-IN')}</strong></div></div><div class="section"><h2>Quick actions</h2></div><div class="actions"><button class="action" onclick="go('students')">👤<b>Add / manage students</b><span class="muted">Profiles & batches</span></button><button class="action" onclick="go('attendance')">📅<b>Mark attendance</b><span class="muted">Present / absent / late</span></button><button class="action" onclick="go('fees')">💰<b>Collect fees</b><span class="muted">Record cash / UPI</span></button><button class="action" onclick="go('reports')">📊<b>View reports</b><span class="muted">Academy summary</span></button></div>`}
async function students(){let s=await all('students'),b=await all('batches');return `<div class="section"><h2>Students (${s.length})</h2><button class="primary" onclick="studentForm()">+ Add</button></div><input id="sq" class="input search" placeholder="Search name / parent / WhatsApp" oninput="filterStudents()"><div id="studentList">${s.length?s.map(x=>studentCard(x,b)).join(''):`<div class="empty">No students yet.<br>Add your first student.</div>`}</div>`}function studentCard(x,b){let batch=b.find(z=>z.id===x.batchId);return `<div class="card sc" data-q="${esc((x.name+' '+x.parent+' '+x.whatsapp).toLowerCase())}"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.studentId||'')} • ${esc(batch?.name||'No batch')}</div></div><span class="badge ${x.active!==false?'green':'red'}">${x.active!==false?'ACTIVE':'INACTIVE'}</span></div><div class="muted" style="margin-top:8px">Parent: ${esc(x.parent||'—')} • ₹${Number(x.monthlyFee||0).toLocaleString('en-IN')}</div><div style="display:flex;gap:7px;margin-top:10px"><button class="secondary" onclick="studentForm(${x.id})">Edit</button>${x.whatsapp?`<button class="secondary" onclick="wa('${x.whatsapp}','Hi ${esc(x.parent||x.name)}, this is Silambam Academy.')">WhatsApp</button>`:''}</div></div>`}function filterStudents(){let q=document.getElementById('sq').value.toLowerCase();document.querySelectorAll('.sc').forEach(x=>x.style.display=x.dataset.q.includes(q)?'block':'none')}
async function studentForm(id){let s=id?(await all('students')).find(x=>x.id===id):{};let b=await all('batches');editing=id||null;document.querySelector('.page').innerHTML=`<div class="section"><h2>${id?'Edit':'Add'} Student</h2></div><div class="card"><div class="formgrid"><div class="field full"><label>Student name</label><input class="input" id="n" value="${esc(s.name)}"></div><div class="field"><label>Parent / Guardian</label><input class="input" id="p" value="${esc(s.parent)}"></div><div class="field"><label>WhatsApp</label><input class="input" id="w" value="${esc(s.whatsapp)}" inputmode="tel"></div><div class="field"><label>Monthly fee</label><input class="input" id="fee" type="number" value="${s.monthlyFee||''}"></div><div class="field"><label>Batch</label><select class="input" id="batch">${b.map(x=>`<option value="${x.id}" ${s.batchId==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Joining date</label><input class="input" id="join" type="date" value="${s.joining||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Status</label><select class="input" id="active"><option value="true" ${s.active!==false?'selected':''}>Active</option><option value="false" ${s.active===false?'selected':''}>Inactive</option></select></div></div><button class="primary" style="width:100%;margin-top:6px" onclick="saveStudent()">Save Student</button><button class="secondary" style="width:100%;margin-top:8px" onclick="go('students')">Cancel</button></div>`}async function saveStudent(){let s=editing?(await all('students')).find(x=>x.id===editing):{};let obj={...s,name:document.getElementById('n').value.trim(),parent:document.getElementById('p').value.trim(),whatsapp:document.getElementById('w').value.trim(),monthlyFee:Number(document.getElementById('fee').value||0),batchId:Number(document.getElementById('batch').value),joining:document.getElementById('join').value,active:document.getElementById('active').value==='true'};if(!obj.name){toast('Enter student name');return}if(!obj.studentId)obj.studentId='SIL-'+String(Date.now()).slice(-5);await put('students',obj);toast('Student saved');go('students')}
async function attendance(){let s=await all('students'),a=await all('attendance'),d=new Date().toISOString().slice(0,10);let today={};a.filter(x=>x.date===d).forEach(x=>today[x.studentId]=x.status);return `<div class="section"><h2>Today's Attendance</h2></div><div class="pillbar"><button class="pill" onclick="markAll('PRESENT')">✓ All Present</button><button class="pill" onclick="markAll('ABSENT')">× All Absent</button><button class="pill" onclick="markAll('LATE')">⏱ All Late</button></div><div id="att">${s.filter(x=>x.active!==false).map(x=>`<div class="card attrow" data-id="${x.id}"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.studentId)}</div></div><div style="display:flex;gap:5px"><button class="pill ${today[x.id]==='PRESENT'?'active':''}" onclick="setAtt(${x.id},'PRESENT',this)">P</button><button class="pill ${today[x.id]==='ABSENT'?'active':''}" onclick="setAtt(${x.id},'ABSENT',this)">A</button><button class="pill ${today[x.id]==='LATE'?'active':''}" onclick="setAtt(${x.id},'LATE',this)">L</button></div></div></div>`).join('')}</div><button class="primary" style="width:100%;position:sticky;bottom:84px" onclick="saveAtt()">SAVE ATTENDANCE</button>`}let attDraft={};function setAtt(id,status,el){attDraft[id]=status;el.parentElement.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));el.classList.add('active')}function markAll(s){document.querySelectorAll('.attrow').forEach(r=>{let id=Number(r.dataset.id);attDraft[id]=s;r.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('active',(s==='PRESENT'&&i===0)||(s==='ABSENT'&&i===1)||(s==='LATE'&&i===2)))});toast('Applied to all')}async function saveAtt(){let d=new Date().toISOString().slice(0,10),old=await all('attendance');for(let [id,status] of Object.entries(attDraft)){let ex=old.find(x=>x.studentId==id&&x.date===d);await put('attendance',{...(ex||{}),studentId:Number(id),date:d,status})}attDraft={};toast('Attendance saved');go('home')}
async function fees(){let s=await all('students'),f=await all('fees'),p=await all('payments');return `<div class="section"><h2>Fees</h2><button class="primary" onclick="generateFees()">Generate month</button></div>${s.filter(x=>x.active!==false).map(x=>{let fs=f.filter(y=>y.studentId===x.id),last=fs.sort((a,b)=>b.month.localeCompare(a.month))[0],paid=p.filter(y=>last&&y.feeId===last.id).reduce((n,y)=>n+Number(y.amount),0);let bal=last?Number(last.amount)-paid:0;return `<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${last?last.month:'No fee schedule'}</div></div><span class="badge ${bal<=0&&last?'green':last?'amber':'red'}">${!last?'NOT GENERATED':bal<=0?'PAID':'₹'+bal.toLocaleString('en-IN')}</span></div>${last?`<div class="muted" style="margin-top:7px">Fee ₹${Number(last.amount).toLocaleString('en-IN')} • Paid ₹${paid.toLocaleString('en-IN')}</div><button class="secondary" style="margin-top:9px;width:100%" onclick="pay(${last.id})">Record payment</button>${x.whatsapp&&bal>0?`<button class="secondary" style="margin-top:7px;width:100%" onclick="wa('${x.whatsapp}','Hi ${esc(x.parent||x.name)}, Silambam Academy fee due: ₹${bal}. Please pay at your convenience.')">WhatsApp reminder</button>`:''}`:''}</div>`}).join('')}`}
async function generateFees(){let s=await all('students'),f=await all('fees'),m=new Date().toISOString().slice(0,7);for(let x of s.filter(x=>x.active!==false)){if(!f.some(y=>y.studentId===x.id&&y.month===m))await put('fees',{studentId:x.id,month:m,amount:Number(x.monthlyFee||0),due:new Date().toISOString().slice(0,10)})}toast('Fees generated');go('fees')}async function pay(id){let f=(await all('fees')).find(x=>x.id===id);let amt=prompt(`Payment for ₹${f.amount}. Enter amount:`);if(amt&&Number(amt)>0){await put('payments',{feeId:id,amount:Number(amt),paidOn:new Date().toISOString().slice(0,10),method:'UPI'});toast('Payment recorded');go('fees')}}function wa(num,msg){let n=String(num).replace(/\D/g,'');if(n.length===10)n='91'+n;location.href='https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
async function reports(){let s=await all('students'),a=await all('attendance'),f=await all('fees'),p=await all('payments');let total=f.reduce((n,x)=>n+Number(x.amount),0),paid=p.reduce((n,x)=>n+Number(x.amount),0);return `<div class="section"><h2>Reports</h2></div><div class="grid"><div class="stat"><span>Students</span><strong>${s.length}</strong></div><div class="stat"><span>Attendance records</span><strong>${a.length}</strong></div><div class="stat"><span>Scheduled</span><strong>₹${total.toLocaleString('en-IN')}</strong></div><div class="stat"><span>Collected</span><strong>₹${paid.toLocaleString('en-IN')}</strong></div></div><div class="card" style="margin-top:12px"><b>Data safety</b><p class="muted">Export a backup regularly. Restore it on a new phone if needed.</p><button class="primary" style="width:100%" onclick="backup()">Export Full Backup</button><button class="secondary" style="width:100%;margin-top:8px" onclick="document.getElementById('restore').click()">Restore Backup</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(event)"></div>`}
async function backup(){let data={version:1,created:new Date().toISOString()};for(let s of stores)data[s]=await all(s);let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='silambam-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}async function restoreFile(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.students||!d.batches)throw 0;if(!confirm('Restore backup? Current local data will be replaced.'))return;for(let s of stores){let old=await all(s);old.forEach(x=>del(s,x.id));for(let x of d[s]||[])await put(s,x)}toast('Backup restored');go('home')}catch{toast('Invalid backup file')}}async function settings(){return `<div class="section"><h2>Settings</h2></div><div class="card"><b>Silambam ERP is local-first</b><p class="muted">Your academy data stays on this phone. No cloud account is required.</p><button class="primary" style="width:100%" onclick="backup()">💾 Backup now</button></div><div class="card"><b>WhatsApp</b><p class="muted">WhatsApp needs internet to send messages. The ERP itself works offline.</p></div><div class="card danger"><b>Reset app data</b><p class="muted">Deletes all local academy data.</p><button class="secondary" onclick="if(confirm('Delete ALL local data?'))resetData()">Reset everything</button></div>`}async function resetData(){for(let s of stores)(await all(s)).forEach(x=>del(s,x.id));toast('Data cleared');go('home')}async function go(v){view=v;await render()}if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js'); if(sessionStorage.getItem('silambam_logged_in')==='1'){openDB().then(seed).then(render)}else{login()}
</script></body></html>
