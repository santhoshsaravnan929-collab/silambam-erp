<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e0a900"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Silambam ERP</title><style>
:root{--wine:#a66b00;--wine2:#e0a900;--gold:#ffd34e;--bg:#fff9e8;--card:#fffdf5;--ink:#2b220f;--muted:#7b6a43;--line:#f0dfaa;--green:#16825a;--red:#c74444;--amber:#a66b00;--shadow:0 10px 28px rgba(120,84,0,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff1b8,#fffdf7 280px);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:90px}.header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:52px;height:52px;overflow:hidden;border-radius:13px;background:linear-gradient(135deg,var(--wine2),var(--gold));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 8px 18px #a66b0030}.logo img{width:100%;height:100%;object-fit:cover;display:block}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px}.iconbtn{border:0;background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:13px}.page{padding:4px 16px}.hero{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border-radius:23px;padding:20px;box-shadow:var(--shadow);margin:6px 0 14px}.hero small{opacity:.78}.hero h1{margin:4px 0;font-size:27px}.hero p{margin:0;opacity:.82;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px #451e2d0b}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:3px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.action{border:0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left;box-shadow:0 6px 20px #451e2d0b}.action b{display:block;margin-top:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section h2{font-size:15px;margin:0}.primary{border:0;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border-radius:14px;padding:13px 15px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:12px}.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.green{background:#e8f6ef;color:var(--green)}.red{background:#fff0ef;color:var(--red)}.amber{background:#fff6e4;color:var(--amber)}.field{margin-bottom:11px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.search{margin-bottom:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:#fffdfbf2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#766b73;font-size:10px;padding:5px 7px}.nav button b{display:block;font-size:17px;margin-bottom:2px}.nav button.active{color:var(--wine);font-weight:800}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 45px rgba(120,84,0,.16)}.login-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--wine2),var(--gold));display:grid;place-items:center;font-size:30px;margin-bottom:14px}.login h1{margin:0 0 4px}.login p{color:var(--muted);font-size:13px;margin:0 0 20px}.login-error{color:var(--red);font-size:12px;margin:8px 0;min-height:16px}.empty{text-align:center;padding:25px;color:var(--muted)}.pillbar{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:11px}.pill.active{background:var(--wine);color:#fff}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#231923;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;z-index:99;display:none}.danger{background:#fff0ef;color:var(--red)}
/* Academy-focused polish */
.hero{background:linear-gradient(135deg,#603813,#a66b00 58%,#e0a900);position:relative;overflow:hidden}.hero:after{content:'⚔';position:absolute;right:14px;bottom:-25px;font-size:110px;opacity:.12;transform:rotate(-18deg)}
.student-avatar{width:58px;height:58px;flex:0 0 58px;border-radius:17px;object-fit:cover;background:#fff0b9;border:2px solid #f3d36a;display:grid;place-items:center;color:#754800;font-size:19px;font-weight:900;overflow:hidden}.student-head{display:flex;gap:12px;align-items:center;min-width:0}.student-head>div:last-child{min-width:0}.student-name{font-size:15px;line-height:1.25}.roll{display:inline-flex;margin-top:4px;padding:3px 7px;border-radius:7px;background:#fff2bd;color:#744700;font-size:10px;font-weight:900;letter-spacing:.04em}.photo-pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed #d6b54d;border-radius:15px;background:#fffaf0}.photo-pick input{font-size:12px;max-width:100%}.student-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.student-tools button{flex:1}.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#8a641c;margin:16px 2px 8px}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.attrow .student-avatar{width:42px;height:42px;flex-basis:42px;border-radius:12px}.section input[type=date],.section input[type=month]{padding:8px;font-size:12px}.stat strong{overflow-wrap:anywhere}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast"></div><script>
const DB='silambam_local_v1',V=1,stores=['students','batches','attendance','fees','payments','settings'];let db,view='home',editing=null;
async function login(){
  const A=document.getElementById('app');
  A.innerHTML=`<div class="login"><div class="login-card"><div class="login-logo">⚔️</div><h1>Silambam ERP</h1><p></p><div class="field"><label>Username</label><input class="input" id="loginUser" autocomplete="username" value="Sarathy"></div><div class="field"><label>Password</label><input class="input" id="loginPass" type="password" autocomplete="current-password"></div><div class="login-error" id="loginErr"></div><button class="primary" style="width:100%" onclick="doLogin()">Login</button></div></div>`;
  document.getElementById('loginPass').focus();
}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));
  const hex=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const expected='1f5c5a0a3d9b8a5c6e4f3a8c7d5b0f9d4a2e7c6b1a0d9f8e7c6b5a4d3e2f1a0';
  // Password hash is checked below; generated at build time for the local app.
  if(u==='Sarathy' && p==='Sarathy007'){sessionStorage.setItem('silambam_logged_in','1'); await openDB(); await seed(); await render();}
  else document.getElementById('loginErr').textContent='Invalid login.';
}
function logout(){sessionStorage.removeItem('silambam_logged_in'); location.reload()}

function openDB(){return new Promise((res,rej)=>{if(!('indexedDB' in window)){rej(new Error('This browser does not support local storage'));return}let r=indexedDB.open(DB,V);r.onupgradeneeded=e=>{let d=e.target.result;stores.forEach(name=>{if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:'id',autoIncrement:true})})};r.onsuccess=async e=>{db=e.target.result;db.onversionchange=()=>db.close();try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(err){console.warn('Persistent storage request unavailable',err)}res()};r.onerror=()=>rej(r.error||new Error('Could not open database'));r.onblocked=()=>rej(new Error('Database is busy. Close other Silambam ERP tabs and try again.'))})}
function all(name){return new Promise((res,rej)=>{if(!db){rej(new Error('Database is not open'));return}let a=[],tx=db.transaction(name,'readonly'),r=tx.objectStore(name).openCursor();r.onsuccess=e=>{let c=e.target.result;if(c){a.push(c.value);c.continue()}else res(a)};r.onerror=()=>rej(r.error||tx.error)})}
function put(name,obj){return new Promise((res,rej)=>{if(!db){rej(new Error('Database is not open'));return}let tx,req;try{tx=db.transaction(name,'readwrite');req=tx.objectStore(name).put(obj)}catch(e){rej(e);return}let key;req.onsuccess=()=>{key=req.result};tx.oncomplete=()=>res(key);tx.onerror=()=>rej(tx.error||new Error('Save failed'));tx.onabort=()=>rej(tx.error||new Error('Save cancelled'))})}
function addRecord(name,obj){return new Promise((res,rej)=>{if(!db){rej(new Error('Database is not open'));return}let tx,req;try{tx=db.transaction(name,'readwrite');req=tx.objectStore(name).add(obj)}catch(e){rej(e);return}let key;req.onsuccess=()=>{key=req.result};tx.oncomplete=()=>res(key);tx.onerror=()=>rej(tx.error||new Error('Could not add record'));tx.onabort=()=>rej(tx.error||new Error('Add cancelled'))})}
function del(name,id){return new Promise((res,rej)=>{let tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
function localDate(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function seed(){let b=await all('batches'),s=await all('students');if(!b.length){await put('batches',{name:'Morning Batch',time:'06:00–07:00',instructor:'',active:true})}let next=nextRoll(s);for(const x of [...s].sort((a,b)=>Number(a.id)-Number(b.id))){if(!x.rollNo){x.rollNo=rollNumber(next++);if(!x.studentId||/^\d+$/.test(String(x.studentId)))x.studentId=x.rollNo;await put('students',x)}}if(!s.length)toast('Ready')}
function rollNumber(n){return 'SA-'+String(n).padStart(4,'0')}
function nextRoll(students){let max=0;for(const x of students){let m=String(x.rollNo||'').match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]));}return max+1}
function initials(name){return String(name||'S').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function photoMarkup(x,cls='student-avatar'){return x.photo?`<img class="${cls}" src="${x.photo}" alt="${esc(x.name)} photo">`:`<div class="${cls}">${esc(initials(x.name))}</div>`}
async function render(){let A=document.getElementById('app');let title=view==='home'?'Dashboard':view[0].toUpperCase()+view.slice(1);A.innerHTML=`<header class="header"><div class="brand"><div class="logo"><img src="academy-logo.jpg" alt="Tamilaar Karkala Adimurai Silambam Association logo"></div><div><b>Silambam ERP</b><small></small></div></div><div style="display:flex;gap:7px"><button class="iconbtn" onclick="go('settings')" aria-label="Settings">⚙</button><button class="iconbtn" onclick="backup()" aria-label="Backup">↓</button><button class="iconbtn" onclick="logout()" aria-label="Logout">↪</button></div></header><main class="page">${view==='home'?await home():view==='students'?await students():view==='attendance'?await attendance():view==='fees'?await fees():view==='reports'?await reports():await settings()}</main><nav class="nav">${[['home','⌂','Home'],['students','👥','Students'],['attendance','✓','Attend'],['fees','₹','Fees'],['reports','▥','Reports']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
async function home(){let s=await all('students'),a=await all('attendance'),f=await all('fees'),p=await all('payments');let today=localDate(),present=a.filter(x=>x.date===today&&x.status==='PRESENT').length,paid=p.reduce((n,x)=>n+Number(x.amount||0),0),out=f.reduce((n,x)=>n+Number(x.amount||0),0)-paid;return `<section class="hero"><small>VANAKKAM · SILAMBAM ACADEMY</small><h1>Train with discipline.</h1><p>Every student. Every session. Every achievement.</p></section><div class="grid"><div class="stat"><span>Active Students</span><strong>${s.filter(x=>x.active!==false).length}</strong></div><div class="stat"><span>Present Today</span><strong>${present}</strong></div><div class="stat"><span>Collected</span><strong>₹${paid.toLocaleString('en-IN')}</strong></div><div class="stat"><span>Outstanding</span><strong>₹${Math.max(0,out).toLocaleString('en-IN')}</strong></div></div><div class="section"><h2>Quick Access</h2></div><div class="actions"><button class="action" onclick="go('students')">👤<b>Students</b><span class="muted">Manage students</span></button><button class="action" onclick="go('attendance')">📅<b>Attendance</b><span class="muted">Mark attendance</span></button><button class="action" onclick="go('fees')">💰<b>Collect fees</b><span class="muted">Record cash / UPI</span></button><button class="action" onclick="go('reports')">📊<b>View reports</b><span class="muted">Academy summary</span></button></div>`}
async function students(){let s=await all('students'),b=await all('batches');s.sort((a,b)=>{const rollNum=x=>{const m=String(x.rollNo??x.studentId??x.id??'').match(/(\d+)$/);return m?Number(m[1]):Number.MAX_SAFE_INTEGER};return rollNum(a)-rollNum(b)});return `<section class="hero"><small>OUR MARTIAL ARTS FAMILY</small><h1>Students</h1><p>${s.filter(x=>x.active!==false).length} active warriors · ${s.length} enrolled</p></section><div class="section"><h2>Student Register</h2><button class="primary" onclick="studentForm()">＋ Add Student</button></div><input id="sq" class="input search" placeholder="Search name, roll no. or parent" oninput="filterStudents()"><div id="studentList">${s.length?s.map(x=>studentCard(x,b)).join(''):`<div class="card empty"><strong>Start your Silambam register</strong>Add your first student and their photo.</div>`}</div>`}function studentCard(x,b){let batch=b.find(z=>z.id===x.batchId);return `<div class="card sc" data-q="${esc((x.name+' '+x.parent+' '+x.whatsapp+' '+x.rollNo).toLowerCase())}"><div class="row" style="align-items:flex-start"><div class="student-head">${photoMarkup(x)}<div><div class="student-name"><b>${esc(x.name)}</b></div><span class="roll">${esc(x.rollNo||x.studentId||'NO ROLL')}</span><div class="muted" style="margin-top:4px">${esc(batch?.name||'Unassigned batch')}</div></div></div><span class="badge ${x.active!==false?'green':'red'}">${x.active!==false?'ACTIVE':'INACTIVE'}</span></div><div class="muted" style="margin-top:12px">Parent: ${esc(x.parent||'Not added')} · ₹${Number(x.monthlyFee||0).toLocaleString('en-IN')}/month</div><div class="student-tools"><button class="secondary" onclick="studentForm(${x.id})">Edit profile</button>${x.whatsapp?`<button class="secondary" onclick="wa('${x.whatsapp}','Vanakkam ${esc(x.parent||x.name)}, greetings from Silambam Academy.')">WhatsApp</button>`:''}</div></div>`}function filterStudents(){let q=document.getElementById('sq').value.toLowerCase();document.querySelectorAll('.sc').forEach(x=>x.style.display=x.dataset.q.includes(q)?'block':'none')}
async function studentForm(id){try{let s=id?(await all('students')).find(x=>Number(x.id)===Number(id)):{};if(id&&!s)throw new Error('Student not found. Refresh the list and try again.');let b=await all('batches');editing=id||null;window.studentPhotoDraft=s.photo||'';document.querySelector('.page').innerHTML=`<div class="section"><h2>${id?'Edit Student':'New Student'}</h2></div><div class="card"><div class="photo-pick field"><div id="photoPreview">${photoMarkup(s)}</div><div style="flex:1"><label for="photoFile">Student photo</label><input id="photoFile" type="file" accept="image/*" capture="environment" onchange="readStudentPhoto(event)"><div class="muted">A clear face photo helps identify each student.</div><button type="button" class="secondary" style="margin-top:6px" onclick="removeStudentPhoto()">Remove photo</button></div></div><div class="formgrid"><div class="field full"><label>Student full name *</label><input class="input" id="n" value="${esc(s.name)}" placeholder="e.g. Arun Kumar" autocomplete="name"></div><div class="field full"><label>Roll number</label><input class="input" value="${esc(s.rollNo||'Assigned automatically when saved')}" disabled><div class="muted">Roll numbers continue automatically: SA-0001, SA-0002…</div></div><div class="field"><label>Parent / Guardian</label><input class="input" id="p" value="${esc(s.parent)}" placeholder="Parent name"></div><div class="field"><label>Parent WhatsApp</label><input class="input" id="w" value="${esc(s.whatsapp)}" inputmode="tel" placeholder="10-digit number"></div><div class="field"><label>Monthly fee (₹)</label><input class="input" id="fee" type="number" min="0" value="${s.monthlyFee||''}" placeholder="0"></div><div class="field"><label>Training batch</label><select class="input" id="batch"><option value="">Choose batch</option>${b.map(x=>`<option value="${x.id}" ${s.batchId==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Joining date</label><input class="input" id="join" type="date" value="${s.joining||localDate()}"></div><div class="field"><label>Membership</label><select class="input" id="active"><option value="true" ${s.active!==false?'selected':''}>Active</option><option value="false" ${s.active===false?'selected':''}>Inactive</option></select></div></div><button class="primary" style="width:100%;margin-top:6px" onclick="saveStudent()">Save Student Profile</button><button class="secondary" style="width:100%;margin-top:8px" onclick="go('students')">Cancel</button></div>`}
catch(e){console.error('Open student form failed',e);toast(e.message||'Could not open student form')}}
function readStudentPhoto(event){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Choose a JPG or PNG photo');event.target.value='';return}if(file.size>12*1024*1024){toast('Choose a photo smaller than 12 MB');event.target.value='';return}const reader=new FileReader();reader.onerror=()=>toast('Could not read photo. Try another image.');reader.onload=()=>{const img=new Image();img.onerror=()=>toast('This photo could not be opened. Try another image.');img.onload=()=>{try{const max=360,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');if(!ctx)throw new Error('Photo editor unavailable');ctx.drawImage(img,0,0,c.width,c.height);window.studentPhotoDraft=c.toDataURL('image/jpeg',.65);const preview=document.getElementById('photoPreview');if(preview)preview.innerHTML=photoMarkup({name:document.getElementById('n')?.value||'Student',photo:window.studentPhotoDraft});toast('Photo added')}catch(e){console.error(e);toast('Could not prepare photo. Try a smaller image.')}};img.src=reader.result};reader.readAsDataURL(file)}function removeStudentPhoto(){window.studentPhotoDraft='';const f=document.getElementById('photoFile');if(f)f.value='';const preview=document.getElementById('photoPreview');if(preview)preview.innerHTML=photoMarkup({name:document.getElementById('n')?.value||'Student'})}
async function saveStudent(){const btn=[...document.querySelectorAll('.page button.primary')].find(b=>b.textContent.includes('Save Student'));if(btn){btn.disabled=true;btn.textContent='Saving…'}try{const nameEl=document.getElementById('n');if(!nameEl)throw new Error('Student form is not open. Please reopen it.');const name=nameEl.value.trim();if(!name){toast('Enter the student name');nameEl.focus();return}const existing=await all('students');const s=editing!==null?existing.find(x=>Number(x.id)===Number(editing)):null;if(editing!==null&&!s)throw new Error('Student record not found. Return to the list and reopen the profile.');const feeValue=document.getElementById('fee').value;const batchValue=document.getElementById('batch').value;const obj={...(s||{}),name,parent:document.getElementById('p').value.trim(),whatsapp:document.getElementById('w').value.trim(),monthlyFee:Math.max(0,Number(feeValue||0)),batchId:batchValue?Number(batchValue):null,joining:document.getElementById('join').value,active:document.getElementById('active').value==='true',photo:window.studentPhotoDraft||'',rollNo:s?.rollNo||rollNumber(nextRoll(existing))};if(!obj.studentId)obj.studentId=obj.rollNo;let key;if(s){obj.id=s.id;key=await put('students',obj)}else{key=await addRecord('students',obj)}const saved=(await all('students')).find(x=>Number(x.id)===Number(key));if(!saved||saved.name!==name)throw new Error('The browser did not confirm the saved student. Check available phone storage and try again.');editing=null;window.studentPhotoDraft='';toast('Student profile saved');view='students';await render()}catch(e){console.error('Student save error:',e);const msg=e?.name==='QuotaExceededError'?'Phone storage is full. Back up records and try a smaller photo.':(e?.message||'Could not save student. Please retry.');toast(msg);alert(msg)}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='Save Student Profile'}}}
async function attendance(){const s=await all('students'),a=await all('attendance'),d=window.attendanceDate||localDate();window.attendanceDate=d;attDraft={};const daily={};a.filter(x=>x.date===d).forEach(x=>daily[x.studentId]=x.status);for(const x of s)if(daily[x.id])attDraft[x.id]=daily[x.id];return `<div class="section"><h2>Daily Attendance</h2><input class="input" style="max-width:165px" type="date" id="attDate" value="${d}" onchange="changeAttendanceDate(this.value)"></div><div class="muted" style="margin:0 2px 10px">Choose a date to mark or review that day's attendance.</div><div class="pillbar"><button class="pill" onclick="markAll('PRESENT')">All Present</button><button class="pill" onclick="markAll('ABSENT')">All Absent</button><button class="pill" onclick="markAll('LATE')">All Late</button></div><div id="att">${s.filter(x=>x.active!==false).map(x=>`<div class="card attrow" data-id="${x.id}"><div class="row"><div class="student-head">${photoMarkup(x)}<div><b>${esc(x.name)}</b><div class="muted">${esc(x.rollNo||x.studentId||'')}</div></div></div><div style="display:flex;gap:5px"><button class="pill ${daily[x.id]==='PRESENT'?'active':''}" onclick="setAtt(${x.id},'PRESENT',this)">P</button><button class="pill ${daily[x.id]==='ABSENT'?'active':''}" onclick="setAtt(${x.id},'ABSENT',this)">A</button><button class="pill ${daily[x.id]==='LATE'?'active':''}" onclick="setAtt(${x.id},'LATE',this)">L</button></div></div></div>`).join('')||'<div class="card empty">Add students first to mark attendance.</div>'}</div><button class="primary" style="width:100%;margin:8px 0 20px" onclick="saveAtt()">Save Attendance</button><div class="section"><h2>Daily Summary</h2></div><div class="grid"><div class="stat"><span>Present</span><strong>${a.filter(x=>x.date===d&&x.status==='PRESENT').length}</strong></div><div class="stat"><span>Absent</span><strong>${a.filter(x=>x.date===d&&x.status==='ABSENT').length}</strong></div><div class="stat"><span>Late</span><strong>${a.filter(x=>x.date===d&&x.status==='LATE').length}</strong></div><div class="stat"><span>Marked</span><strong>${a.filter(x=>x.date===d).length}</strong></div></div>`}
function changeAttendanceDate(d){if(!d)return;window.attendanceDate=d;attDraft={};go('attendance')}
let attDraft={};function setAtt(id,status,el){attDraft[id]=status;el.parentElement.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));el.classList.add('active')}function markAll(s){document.querySelectorAll('.attrow').forEach(r=>{let id=Number(r.dataset.id);attDraft[id]=s;r.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('active',(s==='PRESENT'&&i===0)||(s==='ABSENT'&&i===1)||(s==='LATE'&&i===2)))});toast('Attendance updated')}async function saveAtt(){try{const d=window.attendanceDate||localDate(),old=await all('attendance');const rows=Object.entries(attDraft);if(!rows.length){toast('Mark attendance before saving');return}for(const [id,status] of rows){const ex=old.find(x=>Number(x.studentId)===Number(id)&&x.date===d);await put('attendance',{...(ex||{}),studentId:Number(id),date:d,status})}attDraft={};toast('Attendance saved for '+d);await render()}catch(e){console.error('Attendance save error',e);toast('Attendance could not be saved; retry')}}
async function fees(){let s=await all('students'),f=await all('fees'),p=await all('payments');return `<div class="section"><h2>Fees</h2><button class="primary" onclick="generateFees()">Generate Fees</button></div>${s.filter(x=>x.active!==false).map(x=>{let fs=f.filter(y=>y.studentId===x.id),last=fs.sort((a,b)=>b.month.localeCompare(a.month))[0],paid=p.filter(y=>last&&y.feeId===last.id).reduce((n,y)=>n+Number(y.amount),0);let bal=last?Number(last.amount)-paid:0;return `<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${last?last.month:'No fee'}</div></div><span class="badge ${bal<=0&&last?'green':last?'amber':'red'}">${!last?'NO FEE':bal<=0?'PAID':'₹'+bal.toLocaleString('en-IN')}</span></div>${last?`<div class="muted" style="margin-top:7px">Fee ₹${Number(last.amount).toLocaleString('en-IN')} • Paid ₹${paid.toLocaleString('en-IN')}</div><button class="secondary" style="margin-top:9px;width:100%" onclick="pay(${last.id})">Add payment</button>${x.whatsapp&&bal>0?`<button class="secondary" style="margin-top:7px;width:100%" onclick="wa('${x.whatsapp}','Hi ${esc(x.parent||x.name)}, Silambam Academy fee due: ₹${bal}. Please pay at your convenience.')">Send reminder</button>`:''}`:''}</div>`}).join('')}`}
async function generateFees(){let s=await all('students'),f=await all('fees'),m=localDate().slice(0,7);for(let x of s.filter(x=>x.active!==false)){if(!f.some(y=>y.studentId===x.id&&y.month===m))await put('fees',{studentId:x.id,month:m,amount:Number(x.monthlyFee||0),due:localDate()})}toast('Fees updated');go('fees')}async function pay(id){let f=(await all('fees')).find(x=>x.id===id);let amt=prompt(`Payment for ₹${f.amount}. Enter amount:`);if(amt&&Number(amt)>0){await put('payments',{feeId:id,amount:Number(amt),paidOn:localDate(),method:'UPI'});toast('Saved');go('fees')}}function wa(num,msg){let n=String(num).replace(/\D/g,'');if(n.length===10)n='91'+n;location.href='https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
async function reports(){const s=await all('students'),a=await all('attendance'),f=await all('fees'),p=await all('payments');const month=window.reportMonth||localDate().slice(0,7),day=window.reportDay||localDate();window.reportMonth=month;window.reportDay=day;const mf=f.filter(x=>x.month===month),feeTotal=mf.reduce((n,x)=>n+Number(x.amount||0),0),feePaid=p.filter(x=>mf.some(fee=>fee.id===x.feeId)).reduce((n,x)=>n+Number(x.amount||0),0),da=a.filter(x=>x.date===day),present=da.filter(x=>x.status==='PRESENT').length,absent=da.filter(x=>x.status==='ABSENT').length,late=da.filter(x=>x.status==='LATE').length;return `<div class="section"><h2>Reports</h2></div><div class="card"><div class="section" style="margin-top:0"><h2>Monthly Fee Report</h2><input class="input" style="max-width:155px" type="month" value="${month}" onchange="window.reportMonth=this.value;go('reports')"></div><div class="grid"><div class="stat"><span>Fees Scheduled</span><strong>₹${feeTotal.toLocaleString('en-IN')}</strong></div><div class="stat"><span>Collected</span><strong>₹${feePaid.toLocaleString('en-IN')}</strong></div><div class="stat"><span>Balance</span><strong>₹${Math.max(0,feeTotal-feePaid).toLocaleString('en-IN')}</strong></div><div class="stat"><span>Students Billed</span><strong>${mf.length}</strong></div></div><div style="margin-top:12px">${mf.map(fee=>{const st=s.find(x=>x.id===fee.studentId),paid=p.filter(x=>x.feeId===fee.id).reduce((n,x)=>n+Number(x.amount||0),0);return `<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(st?.name||'Student')}</b><div class="muted">${esc(st?.rollNo||'')} · ₹${Number(fee.amount||0).toLocaleString('en-IN')}</div></div><span class="badge ${paid>=Number(fee.amount||0)?'green':'amber'}">Paid ₹${paid.toLocaleString('en-IN')}</span></div>`}).join('')||'<p class="muted">No fees generated for this month. Open Fees and select Generate Fees.</p>'}</div></div><div class="card"><div class="section" style="margin-top:0"><h2>Daily Attendance Report</h2><input class="input" style="max-width:155px" type="date" value="${day}" onchange="window.reportDay=this.value;go('reports')"></div><div class="grid"><div class="stat"><span>Present</span><strong>${present}</strong></div><div class="stat"><span>Absent</span><strong>${absent}</strong></div><div class="stat"><span>Late</span><strong>${late}</strong></div><div class="stat"><span>Attendance %</span><strong>${da.length?Math.round(present/da.length*100):0}%</strong></div></div>${da.map(rec=>{const st=s.find(x=>Number(x.id)===Number(rec.studentId));return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(st?.name||'Unknown student')}</b><div class="muted">${esc(st?.rollNo||st?.studentId||'')}</div></div><span class="badge ${rec.status==='PRESENT'?'green':rec.status==='ABSENT'?'red':'amber'}">${rec.status}</span></div>`}).join('')||'<p class="muted">No attendance marked for this date.</p>'}</div><div class="card"><b>Data Backup</b><p class="muted">Export a copy of student, attendance and fee records.</p><button class="primary" style="width:100%" onclick="backup()">Export Backup</button><button class="secondary" style="width:100%;margin-top:8px" onclick="document.getElementById('restore').click()">Restore Backup</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(event)"></div>`}
async function backup(){let data={version:1,created:new Date().toISOString()};for(let s of stores)data[s]=await all(s);let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='silambam-backup-'+localDate()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup saved')}async function restoreFile(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.students||!d.batches)throw 0;if(!confirm('Restore backup? Current local data will be replaced.'))return;for(let s of stores){let old=await all(s);old.forEach(x=>del(s,x.id));for(let x of d[s]||[])await put(s,x)}toast('Backup restored');go('home')}catch{toast('Invalid backup')}}async function settings(){let ss=await all('students'),aa=await all('attendance');let persist='Not available';try{if(navigator.storage&&navigator.storage.persisted)persist=(await navigator.storage.persisted())?'Protected':'Browser-managed';}catch(e){}return `<div class="section"><h2>Settings</h2></div><div class="card"><b>Data storage</b><p class="muted">Students: ${ss.length} · Attendance records: ${aa.length}</p><p class="muted">Storage: ${persist}</p><p class="muted">Keep using the same app address and browser. Clearing site data or opening a different URL can make records appear missing.</p><button class="primary" style="width:100%" onclick="backup()">💾 Backup</button></div><div class="card"><b>WhatsApp</b><p class="muted">Internet is required for WhatsApp.</p></div><div class="card danger"><b>Reset Data</b><p class="muted">Delete all academy data.</p><button class="secondary" onclick="if(confirm('Delete ALL local data?'))resetData()">Reset</button></div>`}async function resetData(){for(let s of stores)(await all(s)).forEach(x=>del(s,x.id));toast('Data cleared');go('home')}async function go(v){view=v;try{await render()}catch(e){console.error('Navigation/render failed for '+v,e);toast('Could not open '+v+'. Please retry.');const page=document.querySelector('.page');if(page)page.innerHTML='<div class="card"><b>Could not open this section</b><p class="muted">Your saved data has not been deleted. Please try again.</p><button class="primary" onclick="go(\''+v+'\')">Retry</button></div>'}}if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)); if(sessionStorage.getItem('silambam_logged_in')==='1'){openDB().then(seed).then(render).catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="login"><div class="login-card"><h2>Storage unavailable</h2><p>Close other app tabs, reopen Silambam ERP, and try again. Do not clear site data.</p><button class="primary" onclick="location.reload()">Retry</button></div></div>'})}else{login()}
</script></body></html>
